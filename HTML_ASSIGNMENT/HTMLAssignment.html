<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Assignments</title>
  <!-- Font Awesome CDN for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top left, #ffecd2, #fcb69f);
      color: #033;
      text-align: center;
    }

    h1 {
      color: #d84315;
      margin-bottom: 40px;
      font-size: 2.8rem;
      text-shadow: 2px 2px 4px #fff;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: auto;
    }

    .assignment-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px;
      background: linear-gradient(145deg, #ffe0b2, #ffcc80);
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      color: #4e342e;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .assignment-btn i {
      transition: transform 0.3s ease;
    }

    .assignment-btn:hover {
      background: linear-gradient(145deg, #ffb74d, #ffe0b2);
      transform: scale(1.05);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
    }

    .assignment-btn:hover i {
      transform: rotate(20deg) scale(1.2);
    }

    .assignment-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <h1>HTML Assignments</h1>
  <div class="container">

    <a class="assignment-btn" href="assignment7.html" target="_blank"><i class="fas fa-file-alt"></i> Assignment No 7</a>
    <a class="assignment-btn" href="assignment8.html" target="_blank"><i class="fas fa-file-alt"></i> Assignment No 8</a>
