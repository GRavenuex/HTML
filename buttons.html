<style>
    .subscribe-button{
        background-color:red;
        color : white;
        border : none ;
        height: 36px;
        width : 105px;
        border-radius : 2px;
        cursor : pointer;
       transition:opacity 0.15s;            /* this is used to  give smooth effect */
    }
    .subscribe-button:hover{
      opacity : 0.7;
    }

    .subscribe-button:active{
        opacity:0.5;  
    }

    .join-button{
        background-color: white;
        color: blue;
        border-color: blue;
        border-style: solid;
        height  : 36px;
        width : 105px;
        border-radius : 2px ;
        cursor:pointer;
        transition: opacity 0.15s , background-color 0.15s, color 0.15s;
    }
    .join-button:hover{
        background-color: blue;
        color: white;
    }
    .join-button:active{
        opacity:0.5;
    }
    .tweet-button{
        background-color:rgb(36, 170, 223);
        color: white;
        border : none ;
        height : 36px;
        width : 105px;
        border-radius : 20px;
        font-weight : bold;
        font-size : 15px;
        cursor : pointer;

    }
 </style>
<button class="subscribe-button">SUBSCRIBE</button>
<button class="tweet-button">Tweet</button>
<button class="join-button"> JION</button>
